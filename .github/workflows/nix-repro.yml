# Lab 11 (bonus) — CI-verified reproducibility for the Nix build.
#
# Reproducibility you cannot prove in CI is folklore. This workflow builds the
# SAME commit twice, on TWO independent fresh runners, and fails if the two
# artefacts are not bit-identical.
#
#   repro-a / repro-b : independent builds, each emits its digests as job outputs
#   compare           : consumes both and fails the workflow on any mismatch
#
# All third-party actions are pinned to a full 40-character commit SHA.
#
# To demonstrate that the gate actually catches a divergence, set the repository
# variable BREAK_REPRO=true (or dispatch the workflow with the input) — job
# repro-b then perturbs one source file on purpose, the two digests differ, and
# the compare job goes red. No commit is needed:
#     gh variable set BREAK_REPRO --body true
#     gh run rerun <run-id>
#     gh variable delete BREAK_REPRO
name: nix-repro

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      break_reproducibility:
        description: "Perturb one job on purpose to prove the gate catches it"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Reproducibility is asserted over the OCI image tarball; the store hash of
  # the binary is reported alongside it.
  IMAGE_ATTR: .#docker
  BIN_ATTR: .#quicknotes

jobs:
  repro-a:
    name: build A (fresh runner)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      store_hash: ${{ steps.binary.outputs.store_hash }}
      nixpkgs_rev: ${{ steps.meta.outputs.rev }}
      lock_sha: ${{ steps.lock.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Lock the flake (only if no flake.lock is committed yet)
        id: lock
        run: |
          if [ ! -f flake.lock ]; then
            echo "no flake.lock in the repository - generating one"
            nix flake lock
            echo "===== BEGIN flake.lock ====="
            cat flake.lock
            echo "===== END flake.lock ====="
            {
              echo "### flake.lock generated by this run"
              echo ""
              echo '```json'
              cat flake.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          SHA=$(sha256sum flake.lock | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "flake.lock sha256: $SHA"

      - name: Record the locked nixpkgs revision
        id: meta
        run: |
          REV=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "nixpkgs revision: $REV"

      - name: Build the binary
        # A vendorHash mismatch is the expected first outcome (the lab's own
        # prescribed way to learn the value). Surface it in the job summary so
        # the correct hash can be pinned without hunting through the log.
        run: |
          set +e
          nix build "$BIN_ATTR" -L 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### ${{ github.job }}: nix build failed"
              echo ""
              echo 'The value to pin is on the `got:` line:'
              echo ""
              echo '```'
              grep -E 'hash mismatch|specifed|got:|error:' /tmp/build.log || tail -40 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: Store hash of the binary
        id: binary
        run: |
          HASH=$(nix-store --query --hash "$(readlink -f result)")
          echo "store_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "quicknotes store hash: $HASH"

      - name: Build the OCI image
        run: nix build "$IMAGE_ATTR" -L

      - name: Digest of the image tarball
        id: image
        run: |
          DIGEST=$(sha256sum result | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image sha256: $DIGEST"
          echo "size: $(stat -c%s "$(readlink -f result)") bytes"

      - name: Show the image metadata (timestamps are where non-determinism hides)
        run: |
          echo "--- manifest.json ---"
          tar -xOf result manifest.json 2>/dev/null || tar -xzOf result manifest.json
          echo "--- config ---"
          tar -xOf result "$(tar -xOf result manifest.json | jq -r '.[0].Config')" 2>/dev/null \
            | jq '{created, architecture, os, config: {Entrypoint: .config.Entrypoint, User: .config.User, ExposedPorts: .config.ExposedPorts, Env: .config.Env}}' \
            || echo "(config extraction skipped)"

      # ---------------------------------------------------------------------
      # Acceptance evidence for Task 1: the Nix-built binary actually serves.
      # ---------------------------------------------------------------------
      - name: Prove the Nix-built binary serves /health
        run: |
          set -euo pipefail
          DATA_PATH=/tmp/qn-notes.json SEED_PATH=app/seed.json \
            ./result/bin/quicknotes > /tmp/qn.log 2>&1 &
          QN_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- GET /health ---"
          curl -fsS http://127.0.0.1:8080/health
          echo "--- GET /notes (first 200 bytes) ---"
          curl -fsS http://127.0.0.1:8080/notes | head -c 200; echo
          echo "--- process log ---"
          cat /tmp/qn.log
          kill "$QN_PID"

      # ---------------------------------------------------------------------
      # Acceptance evidence for Task 2: the tarball is a real OCI image that
      # docker can load, and it runs as nonroot.
      # ---------------------------------------------------------------------
      - name: Load the Nix-built image into Docker and exercise it
        run: |
          set -euo pipefail
          docker load < result
          docker run -d --name qn-nix -p 8080:8080 quicknotes:v0.1.0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- GET /health from the loaded image ---"
          curl -fsS http://127.0.0.1:8080/health
          echo "--- runtime identity ---"
          docker inspect qn-nix --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}}'
          echo "--- image size ---"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep quicknotes
          docker rm -f qn-nix

  repro-b:
    name: build B (independent runner)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      store_hash: ${{ steps.binary.outputs.store_hash }}
      nixpkgs_rev: ${{ steps.meta.outputs.rev }}
      lock_sha: ${{ steps.lock.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Lock the flake (only if no flake.lock is committed yet)
        id: lock
        run: |
          if [ ! -f flake.lock ]; then
            nix flake lock
          fi
          SHA=$(sha256sum flake.lock | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "flake.lock sha256: $SHA"

      - name: Record the locked nixpkgs revision
        id: meta
        run: |
          REV=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "nixpkgs revision: $REV"

      # ---------------------------------------------------------------------
      # Deliberate divergence, for proving the gate is load-bearing.
      # Only this job is perturbed, so A and B must disagree and `compare`
      # must fail. See submissions/lab11.md, question (i).
      # ---------------------------------------------------------------------
      - name: Perturb this build on purpose (demo only)
        if: ${{ inputs.break_reproducibility || vars.BREAK_REPRO == 'true' }}
        run: |
          echo "::warning::BREAK_REPRO is set — perturbing this job on purpose"
          sed -i 's/DevOps mantra/DIVERGENT BUILD/' app/seed.json
          sed -i 's/^      version = "0.1.0";/      version = "0.1.1";/' flake.nix
          grep -n 'DIVERGENT BUILD' app/seed.json

      - name: Build the binary
        # A vendorHash mismatch is the expected first outcome (the lab's own
        # prescribed way to learn the value). Surface it in the job summary so
        # the correct hash can be pinned without hunting through the log.
        run: |
          set +e
          nix build "$BIN_ATTR" -L 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### ${{ github.job }}: nix build failed"
              echo ""
              echo 'The value to pin is on the `got:` line:'
              echo ""
              echo '```'
              grep -E 'hash mismatch|specifed|got:|error:' /tmp/build.log || tail -40 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: Store hash of the binary
        id: binary
        run: |
          HASH=$(nix-store --query --hash "$(readlink -f result)")
          echo "store_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "quicknotes store hash: $HASH"

      - name: Build the OCI image
        run: nix build "$IMAGE_ATTR" -L

      - name: Digest of the image tarball
        id: image
        run: |
          DIGEST=$(sha256sum result | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image sha256: $DIGEST"
          echo "size: $(stat -c%s "$(readlink -f result)") bytes"

  compare:
    name: assert both builds are bit-identical
    needs: [ repro-a, repro-b ]
    runs-on: ubuntu-latest
    steps:
      - name: Compare the two independent builds
        env:
          DIGEST_A: ${{ needs.repro-a.outputs.digest }}
          DIGEST_B: ${{ needs.repro-b.outputs.digest }}
          STORE_A: ${{ needs.repro-a.outputs.store_hash }}
          STORE_B: ${{ needs.repro-b.outputs.store_hash }}
          REV_A: ${{ needs.repro-a.outputs.nixpkgs_rev }}
          REV_B: ${{ needs.repro-b.outputs.nixpkgs_rev }}
          LOCK_A: ${{ needs.repro-a.outputs.lock_sha }}
          LOCK_B: ${{ needs.repro-b.outputs.lock_sha }}
        run: |
          set -euo pipefail

          MATCH_LOCK=$([ "$LOCK_A" = "$LOCK_B" ] && echo yes || echo NO)
          MATCH_REV=$([ "$REV_A" = "$REV_B" ] && echo yes || echo NO)
          MATCH_STORE=$([ "$STORE_A" = "$STORE_B" ] && echo yes || echo NO)
          MATCH_DIGEST=$([ "$DIGEST_A" = "$DIGEST_B" ] && echo yes || echo NO)

          {
            echo "## Reproducibility gate"
            echo ""
            echo "| artefact | build A | build B | match |"
            echo "|---|---|---|---|"
            echo "| flake.lock sha256 | \`$LOCK_A\` | \`$LOCK_B\` | $MATCH_LOCK |"
            echo "| nixpkgs rev | \`$REV_A\` | \`$REV_B\` | $MATCH_REV |"
            echo "| quicknotes store hash | \`$STORE_A\` | \`$STORE_B\` | $MATCH_STORE |"
            echo "| OCI image sha256 | \`$DIGEST_A\` | \`$DIGEST_B\` | $MATCH_DIGEST |"
            echo ""
            echo "### EVIDENCE (lifted from this run)"
            echo ""
            echo '```'
            echo "run_id            = $GITHUB_RUN_ID"
            echo "flake.lock sha256 = $LOCK_A"
            echo "nixpkgs rev       = $REV_A"
            echo "store hash A      = $STORE_A"
            echo "store hash B      = $STORE_B"
            echo "image sha256 A    = $DIGEST_A"
            echo "image sha256 B    = $DIGEST_B"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"

          fail=0
          [ "$LOCK_A" = "$LOCK_B" ] || {
            echo "::error::flake.lock differs between the two jobs ($LOCK_A vs $LOCK_B)"
            fail=1
          }
          [ "$REV_A" = "$REV_B" ] || {
            echo "::error::the two builds locked different nixpkgs revisions ($REV_A vs $REV_B)"
            fail=1
          }
          [ "$STORE_A" = "$STORE_B" ] || {
            echo "::error::binary store hashes differ: $STORE_A vs $STORE_B"
            fail=1
          }
          [ "$DIGEST_A" = "$DIGEST_B" ] || {
            echo "::error::OCI image digests differ: $DIGEST_A vs $DIGEST_B"
            fail=1
          }

          if [ "$fail" -ne 0 ]; then
            echo "REPRODUCIBILITY GATE FAILED"
            exit 1
          fi
          echo "OK: two independent builds produced identical artefacts."

  # ---------------------------------------------------------------------------
  # The control experiment for Task 2.3: the SAME source built twice by
  # `docker build --no-cache` is expected to produce DIFFERENT image IDs, which
  # is the whole point of the comparison. This job has no `needs:`, so it also
  # produces its evidence on runs where the Nix build is still failing on an
  # unpinned vendorHash.
  # ---------------------------------------------------------------------------
  lab6-baseline:
    name: non-reproducible baseline (Dockerfile built twice)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the baseline Dockerfile is present
        run: |
          if [ ! -f app/Dockerfile ]; then
            echo "::error::app/Dockerfile is missing on this branch — the Task 2.3 comparison needs it"
            exit 1
          fi
          echo "--- app/Dockerfile (first 20 lines) ---"
          head -20 app/Dockerfile

      - name: Build the same source twice with --no-cache
        run: |
          set -euo pipefail
          for run in run1 run2; do
            echo "::group::docker build --no-cache ($run)"
            docker build --no-cache -t "qn-lab6:$run" ./app
            echo "::endgroup::"
          done

      - name: Compare the two baseline image IDs
        id: baseline
        run: |
          set -euo pipefail
          ID1=$(docker inspect --format '{{.Id}}' qn-lab6:run1)
          ID2=$(docker inspect --format '{{.Id}}' qn-lab6:run2)
          CREATED1=$(docker inspect --format '{{.Created}}' qn-lab6:run1)
          CREATED2=$(docker inspect --format '{{.Created}}' qn-lab6:run2)
          SIZE1=$(docker inspect --format '{{.Size}}' qn-lab6:run1)
          SIZE2=$(docker inspect --format '{{.Size}}' qn-lab6:run2)

          echo "run1 id=$ID1 created=$CREATED1 size=$SIZE1"
          echo "run2 id=$ID2 created=$CREATED2 size=$SIZE2"
          echo "id1=$ID1" >> "$GITHUB_OUTPUT"
          echo "id2=$ID2" >> "$GITHUB_OUTPUT"
          echo "created1=$CREATED1" >> "$GITHUB_OUTPUT"
          echo "created2=$CREATED2" >> "$GITHUB_OUTPUT"

          {
            echo "## Lab 6 baseline: two builds of the same source"
            echo ""
            echo '```'
            docker images --no-trunc --format '{{.Repository}}:{{.Tag}}  {{.ID}}  {{.CreatedAt}}  {{.Size}}' | grep qn-lab6 || true
            echo '```'
            echo ""
            if [ "$ID1" = "$ID2" ]; then
              echo "**Image IDs are identical** — this Dockerfile happened to build reproducibly. Recorded as observed."
            else
              echo "**Image IDs differ**, as the lab predicts: \`docker build\` embeds build-time state"
              echo "(layer/config timestamps: \`$CREATED1\` vs \`$CREATED2\`), so the same"
              echo "Dockerfile plus the same source does not produce the same artefact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
